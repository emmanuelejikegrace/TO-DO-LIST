<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>My To-Do List</h1>
    <p class="subtitle">Stay organized. Get things done.</p>
    {% if message %}
        <p>{{ message }}</p>
    {% endif%}    

    <form action="/add" method="POST" class="add-form">
        <input type="text" name="task" placeholder="Enter a task">
        <button type="submit">Add task</button>

    </form>
     
    <ul class="task-list">
        {% for task in tasks %}

           <li>
               {% if task["completed"] %}
                   <s>{{ task["name"] }}</s>
                   — Completed! ✓
                {% else %}   
                    <div class="task-main">
                        <span class="task-name">{{ task["name"] }}</span>
                    
                        <form action="/complete/{{ loop.index0 }}" method="POST" style="display: inline;">
                            <button type="submit" class="complete-btn">Complete</button>
                        </form>
                    </div>
                {% endif %}
                
                <form action="/delete/{{loop.index0}}" method="POST" stylr="display: inline;">
                    <button type="submit" class="delete-btn">Delete</button>    
                </form>

                <form action="/edit/{{ loop.index0 }}" method="POST" class="edit-form">
                    <input type="text" name="new_task" value="{{ task['name'] }}" class="edit-input" onclick="this.select()">
                    <button type="submit" class="save-btn">Save</button>

                </form>

           </li>

        {% endfor %}

    </ul>

</body>
</html>
