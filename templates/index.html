<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>My To-Do List</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% endif%}    

    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter a task">
        <button type="submit">Add task</button>

    </form>
     
    <ul>
        {% for task in tasks %}

           <li>
               {% if task["completed"] %}
                   <s>{{ task["name"] }}</s>
                   — Completed! ✓
                {% else %}   
                    {{ task["name"] }}

                    <form action="/complete/{{ loop.index0 }}" method="POST" style="display: inline">
                        <button type="submite">Complete</button>
                    </form>
                    
                {% endif %}
                
                <form action="/delete/{{loop.index0}}" method="POST" stylr="display: inline;">
                    <button type="submit">Delete</button>    
                </form>

                <form action="/edit/{{ loop.index0 }}" method="POST" style="display: inline;">
                    <input type="text" name="new_task" value="{{ task['name'] }}">
                    <button type="submit">Save</button>

                </form>

           </li>

        {% endfor %}

    </ul>

</body>
</html>
