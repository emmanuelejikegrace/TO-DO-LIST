<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
</head>
<body>

    <h1>My To-Do List</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% endif%}    

    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter a task">
        <button type="submit">Add task</button>

    </form>
     
    <ul>
        {% for task in tasks %}
           <li>{{ task }}</li>
        {% endfor %}    
    </ul>

</body>
</html>
